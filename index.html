<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>小周的工作台</title>
<style>
/* ====== Reset & Variables ====== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f5f7;--card-bg:#fff;--text:#1d1d1f;--text2:#86868b;--text3:#aeaeb2;
  --accent:#0071e3;--accent-hover:#0077ed;--danger:#ff3b30;--success:#34c759;--warning:#ff9500;
  --border:#e5e5ea;--radius:12px;--radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;
  --sidebar-w:72px;--sidebar-expand:180px;
}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;
  display:flex;flex-direction:column;
}

/* ====== Status Bar ====== */
.status-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 16px;background:var(--card-bg);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text2);flex-shrink:0;
}
.status-bar-date{font-weight:500;color:var(--text)}
.status-bar-week{color:var(--text3)}

/* ====== App Container ====== */
.app{display:flex;flex:1;width:100%;overflow:hidden}

/* ====== Sidebar ====== */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--card-bg);
  border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;
  padding:0;z-index:10;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.sidebar-header{padding:16px 0 12px;text-align:center;width:100%}
.sidebar-avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0071e3,#5856D6);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;margin:0 auto 4px;
}
.sidebar-greeting{font-size:10px;color:var(--text2);text-align:center;white-space:nowrap}
.sidebar-nav{flex:1;width:100%;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;
  width:56px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;
  color:var(--text2);text-decoration:none;border:none;background:none;
  font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;
}
.nav-item:active{background:var(--bg);transform:scale(.96)}
.nav-item.active{color:var(--accent);background:#e8f2ff}
.nav-item .nav-icon{font-size:20px;line-height:1}
.nav-item .nav-label{font-size:9px;line-height:1.2;text-align:center;max-width:52px;word-break:keep-all}
.sidebar-footer{width:100%;padding:8px 0 12px;display:flex;flex-direction:column;align-items:center}
.nav-settings{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;width:56px;
  border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;
  color:var(--text3);border:none;background:none;font-family:var(--font);
}
.nav-settings:active{background:var(--bg)}
.nav-settings .nav-icon{font-size:18px}
.nav-settings .nav-label{font-size:9px;color:var(--text3)}

/* ====== Main Content ====== */
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.module{display:none;padding:0;min-height:100%}
.module.active{display:block}

/* ====== Module Header ====== */
.mod-header{
  position:sticky;top:0;z-index:5;background:rgba(245,245,247,.85);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  padding:14px 16px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.mod-title{font-size:17px;font-weight:600;letter-spacing:-.2px}
.mod-header-actions{display:flex;gap:8px;align-items:center}

/* ====== Cards ====== */
.card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.04);margin:10px 12px;overflow:hidden}
.card-pad{padding:14px 16px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.card-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.card-sub{font-size:13px;color:var(--text2);padding:0 16px 12px}

/* ====== Buttons ====== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;
  cursor:pointer;border:none;font-family:var(--font);transition:all .15s;white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:var(--accent-hover)}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-ghost{background:transparent;color:var(--text2);border:none;padding:6px 8px}
.btn-ghost:active{background:var(--bg)}
.btn-icon{width:32px;height:32px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ====== Input ====== */
.input{
  flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:14px;font-family:var(--font);outline:none;background:var(--bg);transition:border-color .2s;
}
.input:focus{border-color:var(--accent);background:#fff}
.select{
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;
  font-size:13px;font-family:var(--font);outline:none;background:var(--bg);color:var(--text);
}
.textarea{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:14px;font-family:var(--font);resize:vertical;min-height:80px;outline:none;background:var(--bg);
}
.textarea:focus{border-color:var(--accent);background:#fff}

/* ====== Tabs / Pills ====== */
.tabs{display:flex;gap:2px;padding:2px;background:var(--bg);border-radius:var(--radius-sm);margin:0 16px 8px}
.tab{
  flex:1;padding:7px 0;text-align:center;font-size:12px;border-radius:6px;cursor:pointer;
  border:none;background:none;color:var(--text2);font-family:var(--font);transition:all .15s;
}
.tab.active{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ====== Tags ====== */
.tag{
  display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:10px;
  font-size:11px;background:var(--bg);color:var(--text2);
}
.tag-p0{background:#e8f2ff;color:var(--accent)}
.tag-p1{background:#fff3e0;color:var(--warning)}
.tag-p2{background:#f3e5f5;color:#9c27b0}
.tag-p3{background:#e8f5e9;color:var(--success)}
.tag-done{background:#f0f0f0;color:var(--text3);text-decoration:line-through}

/* ====== List Items ====== */
.list-item{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  transition:background .15s;
}
.list-item:last-child{border-bottom:none}
.list-item:active{background:var(--bg)}
.list-item-body{flex:1;min-width:0}
.list-item-title{font-size:14px;line-height:1.4;word-break:break-all}
.list-item-meta{font-size:11px;color:var(--text2);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.list-item-actions{display:flex;gap:4px;flex-shrink:0}
.list-item-actions .btn-icon{width:28px;height:28px;font-size:12px}
.empty-state{padding:32px 16px;text-align:center;color:var(--text2);font-size:14px}

/* ====== Checkbox ====== */
.cb{
  width:20px;height:20px;border:2px solid #c7c7cc;border-radius:50%;flex-shrink:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.cb.done{background:var(--accent);border-color:var(--accent)}
.cb.done::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* ====== Modal ====== */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card-bg);border-radius:16px 16px 0 0;width:100%;max-width:500px;
  max-height:80vh;overflow-y:auto;padding:0 0 20px;animation:slideUp .25s;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;
  position:sticky;top:0;background:var(--card-bg);z-index:1;
}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:0 16px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.modal-field .input,.modal-field .select,.modal-field .textarea{width:100%}

/* ====== Calendar ====== */
.calendar{padding:8px 12px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-month{font-size:14px;font-weight:600}
.cal-nav{display:flex;gap:2px}
.cal-nav button{
  width:28px;height:28px;border:none;border-radius:50%;background:var(--bg);
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--text2);margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:8px;font-size:12px;cursor:pointer;position:relative;border:none;background:none;font-family:var(--font);
}
.cal-day:active{background:var(--bg)}
.cal-day.today{font-weight:700;color:var(--accent)}
.cal-day.other-month{color:var(--text3)}
.cal-day.checked::after{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--success);
  position:absolute;bottom:4px;
}
.cal-day.selected{background:var(--accent);color:#fff}
.cal-day.selected.today{color:#fff}
.cal-day.selected.checked::after{background:#fff}

/* ====== Chart Container ====== */
.chart-wrap{margin:10px 0;position:relative}
.chart-wrap canvas{width:100%;height:200px;display:block}

/* ====== News ====== */
.news-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.news-item:active{background:var(--bg)}
.news-title{font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-meta{font-size:11px;color:var(--text2);margin-top:4px;display:flex;gap:8px;align-items:center}
.news-summary{font-size:13px;color:var(--text2);line-height:1.5;margin-top:6px;display:none}
.news-item.expanded .news-summary{display:block}
.news-item.expanded .news-title{-webkit-line-clamp:unset}
.news-badge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500}
.news-badge.hot{background:#fff3e0;color:#e65100}
.news-badge.medical{background:#e8f5e9;color:#2e7d32}

/* ====== English Card ====== */
.eng-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.04);margin:10px 12px;overflow:hidden}
.eng-word{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);
}
.eng-word:last-child{border-bottom:none}
.eng-word-main{font-size:16px;font-weight:500;color:var(--text)}
.eng-word-sub{font-size:12px;color:var(--text2);margin-top:2px}
.eng-streak{
  text-align:center;padding:20px;background:linear-gradient(135deg,#e8f2ff,#f3e5f5);
  border-radius:var(--radius);margin:10px 12px;
}
.eng-streak-num{font-size:36px;font-weight:200;color:var(--accent)}
.eng-streak-label{font-size:12px;color:var(--text2);margin-top:2px}

/* ====== Practice Quiz ====== */
.quiz-card{text-align:center;padding:20px 16px}
.quiz-word{font-size:22px;font-weight:500;margin-bottom:12px}
.quiz-input{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:16px;text-align:center;font-family:var(--font);outline:none;
}
.quiz-input:focus{border-color:var(--accent)}
.quiz-result{margin-top:8px;font-size:14px;min-height:20px}
.quiz-result.correct{color:var(--success)}
.quiz-result.wrong{color:var(--danger)}
.quiz-hint{font-size:13px;color:var(--text2);margin-top:6px}

/* ====== Settings ====== */
.setting-item{
  display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
  border-bottom:1px solid var(--border);
}
.setting-label{font-size:14px}
.setting-desc{font-size:11px;color:var(--text2)}

/* ====== Toast ====== */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;
  background:#1d1d1f;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}

/* ====== Scrollbar ====== */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ====== Responsive: iPhone ====== */
@media(min-width:420px){
  :root{--sidebar-w:80px}
}
@media(min-width:768px){
  :root{--sidebar-w:180px}
  .nav-item{flex-direction:row;width:100%;padding:10px 16px;gap:10px;border-radius:0;justify-content:flex-start}
  .nav-item .nav-label{font-size:13px}
  .nav-item .nav-icon{font-size:18px}
  .nav-settings{flex-direction:row;width:100%;padding:10px 16px;gap:10px;justify-content:flex-start}
  .nav-settings .nav-label{font-size:13px}
  .sidebar-header{padding:20px 16px;text-align:left}
  .sidebar-avatar{margin:0 0 4px}
}

/* ====== Sub-tabs ====== */
.sub-tabs{display:flex;gap:2px;padding:2px;background:var(--bg);border-radius:var(--radius-sm);margin:0 12px 8px}
.sub-tab{
  flex:1;padding:6px 0;text-align:center;font-size:11px;border-radius:6px;cursor:pointer;
  border:none;background:none;color:var(--text2);font-family:var(--font);transition:all .15s;
}
.sub-tab.active{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ====== Search ====== */
.search-wrap{padding:0 12px 8px}
.search-wrap .input{width:100%}

/* ====== Inline form row ====== */
.form-row{display:flex;gap:6px;padding:8px 16px;flex-wrap:wrap}
.form-row .input{flex:1;min-width:100px}
.form-row .select{min-width:80px}

/* ====== Stats row ====== */
.stats-row{display:flex;gap:8px;padding:8px 12px}
.stat-card{
  flex:1;background:var(--card-bg);border-radius:var(--radius);padding:12px;
  text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.stat-num{font-size:24px;font-weight:600;color:var(--accent)}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px}

/* ====== Weight log ====== */
.weight-log-item{
  display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  border-bottom:1px solid var(--border);font-size:13px;
}
.weight-val{font-weight:500;font-size:15px}
.weight-change{font-size:11px}
.weight-change.up{color:var(--danger)}
.weight-change.down{color:var(--success)}
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal container -->
<div id="modal-container"></div>

<!-- Status Bar -->
<div class="status-bar">
  <span class="status-bar-date" id="status-date"></span>
  <span class="status-bar-week" id="status-week"></span>
</div>

<div class="app">
<!-- ====== SIDEBAR ====== -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-avatar">周</div>
    <div class="sidebar-greeting" id="sidebar-greet">下午好</div>
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-module="todo">
      <span class="nav-icon">📋</span><span class="nav-label">待办</span>
    </button>
    <button class="nav-item" data-module="collection">
      <span class="nav-icon">✨</span><span class="nav-label">积累</span>
    </button>
    <button class="nav-item" data-module="exercise">
      <span class="nav-icon">🏃</span><span class="nav-label">运动</span>
    </button>
    <button class="nav-item" data-module="news">
      <span class="nav-icon">📰</span><span class="nav-label">资讯</span>
    </button>
    <button class="nav-item" data-module="english">
      <span class="nav-icon">📖</span><span class="nav-label">英语</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <button class="nav-settings" data-module="settings">
      <span class="nav-icon">⚙️</span><span class="nav-label">设置</span>
    </button>
  </div>
</aside>

<!-- ====== MAIN CONTENT ====== -->
<main class="main" id="main-content"></main>
</div>

<script>
// ============================
//  UTILITIES
// ============================
const $ = (s,d) => (d||document).querySelector(s);
const $$ = (s,d) => (d||document).querySelectorAll(s);
const STO = {
  get(k,f){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):f}catch{return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let K = (()=>{let t=0;return()=>'k_'+Date.now()+'_'+(t++)})();
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtDate(d){const m=d.getMonth()+1,da=d.getDate();return d.getFullYear()+'-'+String(m).padStart(2,'0')+'-'+String(da).padStart(2,'0')}
function todayStr(){return fmtDate(new Date())}
function fmtDateCN(d){return (d.getMonth()+1)+'月'+d.getDate()+'日'}

// Toast
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

// Modal
function showModal(title,bodyHtml,onSave){
  const c=$('#modal-container');
  c.innerHTML=`
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">${title}</div>
          <button class="btn btn-ghost btn-icon" onclick="closeModal()" style="font-size:18px">×</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        <div style="padding:12px 16px 0;display:flex;gap:8px;justify-content:flex-end">
          <button class="btn btn-secondary" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" id="modal-save-btn">保存</button>
        </div>
      </div>
    </div>`;
  $('#modal-save-btn').onclick=()=>{const r=onSave();if(r!==false)closeModal()};
  $('#modal-overlay').onclick=function(e){if(e.target===this)closeModal()};
}
function closeModal(){$('#modal-container').innerHTML=''}

// ============================
//  GREETING & TIME
// ============================
function updateGreeting(){
  const h=new Date().getHours();
  let g='';if(h>=6&&h<9)g='早上好 🌅';else if(h>=9&&h<12)g='上午好 ☀️';else if(h>=12&&h<14)g='中午好 🌤️';else if(h>=14&&h<18)g='下午好 🌤️';else if(h>=18&&h<22)g='晚上好 🌙';else g='夜深了 🌃';
  const el=$('#sidebar-greet');if(el)el.textContent=g;
}
function updateStatusBar(){
  const now=new Date();
  const days=['日','一','二','三','四','五','六'];
  const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate(),w=days[now.getDay()];
  const sd=$('#status-date'),sw=$('#status-week');
  if(sd)sd.textContent=`${y}年${m}月${d}日`;
  if(sw)sw.textContent=`星期${w}`;
}
updateGreeting();updateStatusBar();
setInterval(updateGreeting,60000);
setInterval(updateStatusBar,60000);

// ============================
//  ROUTER
// ============================
const MAIN=$('#main-content');
let currentModule='todo';

const modules={};

function registerModule(name,renderFn){
  modules[name]=renderFn;
}

function navigateTo(name){
  currentModule=name;
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.module===name));
  $$('.nav-settings').forEach(n=>n.classList.toggle('active',n.dataset.module===name));
  if(modules[name])modules[name]();
}

// Sidebar click
document.querySelector('.sidebar-nav').addEventListener('click',e=>{
  const btn=e.target.closest('[data-module]');
  if(btn)navigateTo(btn.dataset.module);
});
document.querySelector('.sidebar-footer').addEventListener('click',e=>{

registerModule('todo',()=>{
  let todos=STO.get('wb_todos_full',[]);
  let activeTab='today';
  let filterPriority='all';

  function filterTodos(){
    if(activeTab==='today'){
      return todos.filter(t=>!t.done && (!t.deadline || t.deadline <= todayStr()));
    }else if(activeTab==='future'){
      return todos.filter(t=>!t.done && t.deadline && t.deadline > todayStr());
    }else{
      return todos.filter(t=>t.done);
    }
  }

  function save(){STO.set('wb_todos_full',todos)}

  function render(){
    let filtered=filterTodos();
    if(filterPriority!=='all')filtered=filtered.filter(t=>t.priority===filterPriority);

    const doneCount=todos.filter(t=>t.done).length;
    const todayCount=todos.filter(t=>!t.done && (!t.deadline||t.deadline<=todayStr())).length;

    MAIN.innerHTML=`
      <div class="mod-header"><div class="mod-title">📋 待办事项</div>
        <div class="mod-header-actions">
          <span style="font-size:11px;color:var(--text2)">今日${todayCount}项</span>
          <button class="btn btn-primary btn-sm" onclick="addTodo()">+ 新增</button>
        </div>
      </div>
      <div class="tabs">
        <button class="tab ${activeTab==='today'?'active':''}" data-tab="today">今日待办</button>
        <button class="tab ${activeTab==='future'?'active':''}" data-tab="future">远期计划</button>
        <button class="tab ${activeTab==='done'?'active':''}" data-tab="done">已完成(${doneCount})</button>
      </div>
      ${activeTab!=='done'?`
      <div style="display:flex;gap:4px;padding:0 16px 8px">
        <button class="btn btn-sm ${filterPriority==='all'?'btn-primary':'btn-secondary'}" data-pri="all">全部</button>
        <button class="btn btn-sm ${filterPriority==='P0'?'btn-primary':'btn-secondary'}" data-pri="P0">🔴 紧急</button>
        <button class="btn btn-sm ${filterPriority==='P1'?'btn-primary':'btn-secondary'}" data-pri="P1">🟡 重要</button>
        <button class="btn btn-sm ${filterPriority==='P2'?'btn-primary':'btn-secondary'}" data-pri="P2">🟢 普通</button>
      </div>`:''}
      <div class="card" style="margin:8px 12px">
        ${filtered.length===0?`<div class="empty-state">${activeTab==='done'?'暂无已完成事项':'暂无待办，去喝杯咖啡 ☕'}</div>`:
        filtered.map(t=>`
          <div class="list-item">
            <div class="cb ${t.done?'done':''}" data-id="${t.id}" onclick="toggleTodo('${t.id}')"></div>
            <div class="list-item-body">
              <div class="list-item-title ${t.done?'tag-done':''}">${esc(t.text)}</div>
              <div class="list-item-meta">
                ${t.priority?`<span class="tag tag-p${t.priority.toLowerCase()}">${t.priority}</span>`:''}
                ${t.deadline?`<span>⏰ ${t.deadline}</span>`:''}
                ${t.note?`<span>💬 ${esc(t.note)}</span>`:''}
              </div>
            </div>
            <div class="list-item-actions">
              ${t.done?`<button class="btn btn-sm btn-secondary" data-id="${t.id}" onclick="archiveTodo('${t.id}')">归档</button>`:''}
              <button class="btn btn-sm btn-danger" data-id="${t.id}" onclick="deleteTodo('${t.id}')">删除</button>
            </div>
          </div>
        `).join('')}
      </div>`;

    // Tab clicks
    $$('.tab').forEach(t=>t.onclick=()=>{activeTab=t.dataset.tab;filterPriority='all';render()});
    // Priority filter
    $$('[data-pri]').forEach(b=>b.onclick=()=>{filterPriority=b.dataset.pri;render()});
  }

  window.addTodo=function(){
    showModal('新增待办',`
      <div class="modal-field"><label>待办内容</label><input class="input" id="todo-text" placeholder="输入待办事项..." maxlength="100"></div>
      <div class="modal-field"><label>优先级</label>
        <select class="select" id="todo-pri" style="width:100%">
          <option value="P2">🟢 普通</option><option value="P1">🟡 重要</option><option value="P0">🔴 紧急</option>
        </select>
      </div>
      <div class="modal-field"><label>截止日期</label><input class="input" type="date" id="todo-deadline"></div>
      <div class="modal-field"><label>备注</label><textarea class="textarea" id="todo-note" placeholder="可选备注..." rows="2"></textarea></div>
    `,()=>{
      const text=$('#todo-text').value.trim();
      if(!text){toast('请输入内容');return false}
      todos.push({id:K(),text,priority:$('#todo-pri').value,deadline:$('#todo-deadline').value,note:$('#todo-note').value.trim(),done:false,createdAt:Date.now()});
      save();render();toast('已添加');
    });
    setTimeout(()=>$('#todo-text').focus(),100);
  };

  window.toggleTodo=function(id){
    const t=todos.find(t=>t.id===id);
    if(t){t.done=!t.done;if(t.done)t.doneAt=Date.now();else delete t.doneAt;save();render()}
  };
  window.deleteTodo=function(id){
    if(confirm('确定删除？')){todos=todos.filter(t=>t.id!==id);save();render();toast('已删除')}
  };
  window.archiveTodo=function(id){
    const t=todos.find(t=>t.id===id);if(t){t.archived=true;save();render();toast('已归档')}
  };

  render();
});

registerModule('collection',()=>{
  let items=STO.get('wb_collections',[]);
  let subTab='inspiration'; // inspiration | quote
  let searchText='';

  function save(){STO.set('wb_collections',items)}

  function render(){
    let list=items.filter(i=>i.type===subTab && !i.archived);
    if(searchText){
      const q=searchText.toLowerCase();
      list=list.filter(i=>i.text.toLowerCase().includes(q)||(i.tags||[]).some(t=>t.toLowerCase().includes(q)));
    }
    list.sort((a,b)=>b.createdAt-a.createdAt);

    MAIN.innerHTML=`
      <div class="mod-header"><div class="mod-title">✨ 积累</div>
        <button class="btn btn-primary btn-sm" onclick="addCollection()">+ 新增</button>
      </div>

        <input class="input" id="coll-search" placeholder="搜索内容或标签..." value="${esc(searchText)}">
      </div>
      <div class="card">
        ${list.length===0?`<div class="empty-state">${searchText?'没有匹配结果':'还没有记录，点右上角 + 添加'}</div>`:
        list.map(i=>`
          <div class="list-item">
            <div class="list-item-body">
              <div class="list-item-title">${esc(i.text)}</div>
              <div class="list-item-meta">
                ${(i.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
                <span>${fmtDateCN(new Date(i.createdAt))}</span>
              </div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-sm btn-secondary" data-id="${i.id}" onclick="copyCollection('${i.id}')">复制</button>
              <button class="btn btn-sm btn-danger" data-id="${i.id}" onclick="archiveCollection('${i.id}')">归档</button>
            </div>
          </div>
        `).join('')}
      </div>`;

    $$('.sub-tab').forEach(t=>t.onclick=()=>{subTab=t.dataset.sub;render()});
    const si=$('#coll-search');if(si){si.oninput=function(){searchText=this.value;render()}}
  }

  window.addCollection=function(){
    showModal(subTab==='quote'?'添加优美句子':'添加灵感随笔',`
      <div class="modal-field"><label>内容</label><textarea class="textarea" id="coll-text" placeholder="输入内容..." rows="4"></textarea></div>
      <div class="modal-field"><label>标签（用逗号分隔）</label><input class="input" id="coll-tags" placeholder="例如：读书, 设计, 生活"></div>
    `,()=>{
      const text=$('#coll-text').value.trim();
      if(!text){toast('请输入内容');return false}
      const tags=$('#coll-tags').value.split(/[,，]/).map(t=>t.trim()).filter(Boolean);
      items.push({id:K(),text,type:subTab,tags,archived:false,createdAt:Date.now()});
      save();render();toast('已保存');
    });
  };

  window.copyCollection=function(id){
    const i=items.find(i=>i.id===id);
    if(i){
      navigator.clipboard.writeText(i.text).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
    }
  };
  window.archiveCollection=function(id){
    const i=items.find(i=>i.id===id);
    if(i){i.archived=true;save();render();toast('已归档')}
  };

  render();
});

registerModule('exercise',()=>{
  let logs=STO.get('wb_exercise_logs',[]); // [{date,type,duration}]
  let weights=STO.get('wb_weights',[]); // [{date,weight}]
  let plans=STO.get('wb_exercise_plans',{types:['有氧运动','力量训练','瑜伽/拉伸','跑步','游泳','骑行'],weeklyGoal:3});
  let calYear,calMonth;
  const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();
  let selectedDate=todayStr();
  let weightTab='chart'; // chart | list

  const workoutTypes=plans.types;

  function saveLogs(){STO.set('wb_exercise_logs',logs)}
  function saveWeights(){STO.set('wb_weights',weights)}
  function savePlans(){STO.set('wb_exercise_plans',plans)}

  function getLogsForDate(d){return logs.filter(l=>l.date===d)}
  function getWeightForDate(d){const w=weights.filter(w=>w.date===d);return w.length?w[w.length-1].weight:null}
  function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
  function firstDayOfMonth(y,m){return new Date(y,m,1).getDay()}

  function renderCalendar(){
    const dim=daysInMonth(calYear,calMonth);
    const fd=firstDayOfMonth(calYear,calMonth);
    const prevDim=daysInMonth(calYear,calMonth-1);
    let html='';
    for(let i=fd-1;i>=0;i--){
      html+=`<button class="cal-day other-month" data-date="${calYear}-${String(calMonth).padStart(2,'0')}-${String(prevDim-i).padStart(2,'0')}">${prevDim-i}</button>`;
    }
    for(let d=1;d<=dim;d++){
      const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const hasLog=getLogsForDate(ds).length>0;
      const isToday=ds===todayStr();
      const isSel=ds===selectedDate;
      html+=`<button class="cal-day${isToday?' today':''}${hasLog?' checked':''}${isSel?' selected':''}" data-date="${ds}">${d}</button>`;
    }
    const totalCells=fd+dim;const rem=(7-(totalCells%7))%7;
    for(let d=1;d<=rem;d++){
      html+=`<button class="cal-day other-month" data-date="">${d}</button>`;
    }
    return html;
  }

  function renderWeightChart(){
    if(weights.length<2)return '<div class="empty-state" style="padding:20px">需要至少2条体重数据才能生成趋势图</div>';
    const sorted=[...weights].sort((a,b)=>a.date.localeCompare(b.date));
    const wValues=sorted.map(s=>s.weight);
    const minW=Math.floor(Math.min(...wValues)-1);
    const maxW=Math.ceil(Math.max(...wValues)+1);
    return `<div class="chart-wrap"><canvas id="weight-canvas"></canvas></div>`;
  }

  function render(){
    const todayLogs=getLogsForDate(todayStr());
    const monthLogs=logs.filter(l=>l.date.startsWith(`${calYear}-${String(calMonth+1).padStart(2,'0')}`));
    const monthDays=new Set(monthLogs.map(l=>l.date)).size;
    const monthGoal=plans.weeklyGoal*4;
    const rate=monthGoal>0?Math.round(monthDays/monthGoal*100):0;
    const todayWeight=getWeightForDate(todayStr());

    MAIN.innerHTML=`
      <div class="mod-header"><div class="mod-title">🏃 运动打卡</div></div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card"><div class="stat-num">${todayLogs.length}</div><div class="stat-label">今日打卡</div></div>
        <div class="stat-card"><div class="stat-num">${monthDays}</div><div class="stat-label">本月运动天数</div></div>
        <div class="stat-card"><div class="stat-num">${rate}%</div><div class="stat-label">月度完成率</div></div>
      </div>

      <!-- Calendar -->
      <div class="card" style="margin:10px 12px">
        <div class="calendar">
          <div class="cal-header">
            <div class="cal-month">${calYear}年${calMonth+1}月</div>
            <div class="cal-nav">
              <button id="cal-prev">◀</button>
              <button id="cal-today">今</button>
              <button id="cal-next">▶</button>
            </div>
          </div>
          <div class="cal-weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="cal-grid" id="cal-grid">${renderCalendar()}</div>
        </div>
      </div>

      <!-- Selected date info -->
      <div class="card" style="margin:0 12px 10px">
        <div class="card-header">
          <div class="card-title">📅 ${selectedDate} ${selectedDate===todayStr()?'(今天)':''}</div>
          <button class="btn btn-primary btn-sm" onclick="addExerciseLog()">打卡</button>
        </div>
        ${getLogsForDate(selectedDate).length===0?'<div class="empty-state" style="padding:16px">当天暂无运动记录</div>':
        getLogsForDate(selectedDate).map(l=>`
          <div class="list-item">
            <div class="list-item-body">
              <div class="list-item-title">${esc(l.type)}</div>
              <div class="list-item-meta">${l.duration}分钟</div>
            </div>
            <button class="btn btn-sm btn-danger" onclick="deleteExerciseLog('${l.date}','${l.type}',${l.duration})">×</button>
          </div>
        `).join('')}
      </div>

      <!-- Weight -->
      <div class="card" style="margin:0 12px 10px">
        <div class="card-header">
          <div class="card-title">⚖️ 体重台账</div>
          <div style="display:flex;gap:4px">
            <button class="btn btn-sm ${weightTab==='chart'?'btn-primary':'btn-secondary'}" data-wtab="chart">趋势图</button>
            <button class="btn btn-sm ${weightTab==='list'?'btn-primary':'btn-secondary'}" data-wtab="list">列表</button>
            <button class="btn btn-primary btn-sm" onclick="addWeightLog()">+ 记录</button>
          </div>
        </div>
        ${todayWeight?`<div class="card-sub">今日体重：<strong>${todayWeight} kg</strong></div>`:''}
        ${weightTab==='chart'?renderWeightChart():
        weights.length===0?'<div class="empty-state" style="padding:16px">暂无体重记录</div>':
        weights.slice().reverse().slice(0,30).map((w,i,arr)=>{
          const prev=arr[i+1];
          let change='';
          if(prev){
            const diff=(w.weight-prev.weight).toFixed(1);
            change=diff>0?`<span class="weight-change up">+${diff}</span>`:diff<0?`<span class="weight-change down">${diff}</span>`:'';
          }
          return `<div class="weight-log-item"><span>${w.date}</span><span class="weight-val">${w.weight} kg</span>${change}</div>`;
        }).join('')}
      </div>

      <!-- Plan Settings -->
      <div class="card" style="margin:0 12px">
        <div class="card-header"><div class="card-title">⚙️ 运动计划</div></div>
        <div class="card-pad" style="font-size:13px;color:var(--text2)">
          每周目标：<strong>${plans.weeklyGoal}</strong> 次
          <button class="btn btn-sm btn-secondary" onclick="editPlan()" style="margin-left:8px">修改</button>
        </div>
        <div class="card-pad" style="font-size:12px;color:var(--text2);padding-top:0">
          运动类型：${workoutTypes.join('、')}
        </div>
      </div>`;

    // Calendar clicks
    $$('#cal-grid .cal-day').forEach(d=>{
      d.onclick=function(){
        if(this.dataset.date)selectedDate=this.dataset.date;
        render();
      };
    });
    $('#cal-prev').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--}render()};
    $('#cal-next').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++}render()};
    $('#cal-today').onclick=()=>{const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();selectedDate=todayStr();render()};
    // Weight tab
    $$('[data-wtab]').forEach(b=>b.onclick=()=>{weightTab=b.dataset.wtab;render()});

    // Draw chart
    setTimeout(()=>{
      const canvas=$('#weight-canvas');
      if(!canvas||weights.length<2)return;
      const ctx=canvas.getContext('2d');
      const dpr=window.devicePixelRatio||1;
      const rect=canvas.parentElement.getBoundingClientRect();
      canvas.width=rect.width*dpr;canvas.height=200*dpr;
      canvas.style.width=rect.width+'px';canvas.style.height='200px';
      ctx.scale(dpr,dpr);
      const W=rect.width,H=200,p=30;
      const sorted=[...weights].sort((a,b)=>a.date.localeCompare(b.date));
      const vals=sorted.map(s=>s.weight);
      const minV=Math.floor(Math.min(...vals)-1),maxV=Math.ceil(Math.max(...vals)+1);
      const range=maxV-minV||1;
      const xStep=(W-p*2)/(sorted.length-1||1);

      // Grid
      ctx.strokeStyle='#e5e5ea';ctx.lineWidth=.5;
      for(let i=0;i<=4;i++){
        const y=p+(H-p*2)/4*i;
        ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(W-p,y);ctx.stroke();
        ctx.fillStyle='#86868b';ctx.font='10px sans-serif';ctx.fillText((maxV-range/4*i).toFixed(1),2,y+3);
      }

      // X labels
      ctx.fillStyle='#86868b';ctx.textAlign='center';
      sorted.forEach((s,i)=>{
        if(i%Math.max(1,Math.floor(sorted.length/6))===0||i===sorted.length-1){
          ctx.fillText(s.date.slice(5),p+i*xStep,H-5);
        }
      });

      // Line
      ctx.beginPath();ctx.strokeStyle='#0071e3';ctx.lineWidth=2;ctx.lineJoin='round';
      sorted.forEach((s,i)=>{
        const x=p+i*xStep,y=p+(H-p*2)*(1-(s.weight-minV)/range);
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();

      // Dots
      sorted.forEach((s,i)=>{
        const x=p+i*xStep,y=p+(H-p*2)*(1-(s.weight-minV)/range);
        ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#0071e3';ctx.fill();
      });

      // Area fill
      ctx.lineTo(p+(sorted.length-1)*xStep,H-p);ctx.lineTo(p,H-p);ctx.closePath();
      const grad=ctx.createLinearGradient(0,p,0,H-p);
      grad.addColorStop(0,'rgba(0,113,227,0.15)');grad.addColorStop(1,'rgba(0,113,227,0.01)');
      ctx.fillStyle=grad;ctx.fill();
    },50);
  }

  window.addExerciseLog=function(){
    showModal('运动打卡',`
      <div class="modal-field"><label>日期</label><input class="input" type="date" id="ex-date" value="${selectedDate}"></div>
      <div class="modal-field"><label>运动类型</label>
        <select class="select" id="ex-type" style="width:100%">${workoutTypes.map(t=>`<option>${t}</option>`).join('')}</select>
      </div>
      <div class="modal-field"><label>时长（分钟）</label><input class="input" type="number" id="ex-duration" value="30" min="1" max="300"></div>
    `,()=>{
      logs.push({date:$('#ex-date').value,type:$('#ex-type').value,duration:parseInt($('#ex-duration').value)||30});
      saveLogs();selectedDate=$('#ex-date').value;render();toast('打卡成功');
    });
  };
  window.deleteExerciseLog=function(date,type,duration){
    logs=logs.filter(l=>!(l.date===date&&l.type===type&&l.duration===duration));
    saveLogs();render();toast('已删除');
  };
  window.addWeightLog=function(){
    showModal('记录体重',`
      <div class="modal-field"><label>日期</label><input class="input" type="date" id="wt-date" value="${todayStr()}"></div>
      <div class="modal-field"><label>体重（kg）</label><input class="input" type="number" id="wt-value" step="0.1" min="20" max="200" placeholder="60.0"></div>
    `,()=>{
      const v=parseFloat($('#wt-value').value);
      if(!v||v<=0){toast('请输入有效体重');return false}
      weights.push({date:$('#wt-date').value,weight:v});
      saveWeights();render();toast('已记录');
    });
  };
  window.editPlan=function(){
    showModal('运动计划',`
      <div class="modal-field"><label>每周目标（次）</label><input class="input" type="number" id="plan-goal" value="${plans.weeklyGoal}" min="1" max="7"></div>
    `,()=>{
      plans.weeklyGoal=parseInt($('#plan-goal').value)||3;
      savePlans();render();toast('已更新');
    });
  };

  render();
});

      {id:'n3',title:'全球科技巨头加速布局AI医疗赛道',summary:'多家科技公司宣布在AI辅助诊断、药物研发等领域加大投入，医疗AI市场规模预计2027年突破300亿美元。',category:'medical',date:t,tag:'AI医疗',source:'经济日报'},
      {id:'n4',title:'中国空间站科学实验取得多项突破',summary:'神舟十八号乘组在轨期间完成多项空间科学实验，包括材料科学、生命科学等领域取得新进展。',category:'hot',date:t,tag:'航天',source:'央视新闻'},
      {id:'n5',title:'卫健委印发基层卫生健康便民惠民服务举措',summary:'新举措涵盖优化门诊服务、延长服务时间、推进家庭医生签约等内容，旨在提升基层医疗服务可及性。',category:'medical',date:t,tag:'基层医疗',source:'国家卫健委'},
      {id:'n6',title:'新能源汽车出口量同比增长45%创历史新高',summary:'今年上半年我国新能源汽车出口突破120万辆，出口目的地覆盖欧洲、东南亚等多个市场。',category:'hot',date:t,tag:'汽车',source:'工信部'},
    ];
  }

  function saveBM(){STO.set('wb_news_bookmarks',bookmarks)}

  function render(){
    const filtered=newsFilter==='medical'?articles.filter(a=>a.category==='medical'):articles;

    MAIN.innerHTML=`
      <div class="mod-header"><div class="mod-title">📰 每日资讯</div>
        <div class="mod-header-actions">
          <button class="btn btn-sm btn-secondary" onclick="refreshNews()">${loading?'刷新中...':'🔄 刷新'}</button>
        </div>
      </div>
      <div class="sub-tabs" style="margin:0 12px 8px">
        <button class="sub-tab ${newsFilter==='all'?'active':''}" data-nfilter="all">🌍 全部资讯</button>
        <button class="sub-tab ${newsFilter==='medical'?'active':''}" data-nfilter="medical">🏥 医疗资讯</button>
        <button class="sub-tab" onclick="navigateTo('collection')" style="background:transparent;color:var(--accent)">⭐ 收藏(${bookmarks.length})</button>
      </div>
      ${loading?`<div class="empty-state">正在加载资讯...</div>`:
      filtered.length===0?`<div class="empty-state">暂无资讯，点击刷新获取最新内容</div>`:
      filtered.map(a=>`
        <div class="news-item ${a.expanded?'expanded':''}" data-id="${a.id}">
          <div class="news-title">
            ${bookmarks.includes(a.id)?'⭐ ':''}${esc(a.title)}
          </div>
          <div class="news-meta">
            <span class="news-badge ${a.category==='medical'?'medical':'hot'}">${a.category==='medical'?'医疗':'热点'}</span>
            <span>${a.source}</span>
            <span>${a.date}</span>
            ${a.tag?`<span>#${esc(a.tag)}</span>`:''}
          </div>
          <div class="news-summary">${esc(a.summary)}
            <div style="margin-top:8px;display:flex;gap:8px">
              <button class="btn btn-sm ${bookmarks.includes(a.id)?'btn-primary':'btn-secondary'}" data-bm="${a.id}">
                ${bookmarks.includes(a.id)?'★ 已收藏':'☆ 收藏'}
              </button>
            </div>
          </div>
        </div>
      `).join('')}`;

    // Filter tabs
    $$('[data-nfilter]').forEach(t=>t.onclick=()=>{newsFilter=t.dataset.nfilter;render()});
    // Expand/collapse
    $$('.news-item').forEach(item=>{
      item.onclick=function(e){
        if(e.target.closest('button'))return;
        const a=articles.find(a=>a.id===this.dataset.id);
        if(a){a.expanded=!a.expanded;render()}
      };
    });
    // Bookmark
    $$('[data-bm]').forEach(b=>{
      b.onclick=function(e){
        e.stopPropagation();
        const id=this.dataset.bm;
        if(bookmarks.includes(id))bookmarks=bookmarks.filter(b=>b!==id);
        else bookmarks.push(id);
        saveBM();render();
      };
    });
  }

  function loadArticles(){
    loading=true;render();
    // In a real app, you'd fetch from an API here
    // For demo, simulate network delay
    setTimeout(()=>{
      articles=getDemoArticles();
      loading=false;render();
    },600);
  }

  window.refreshNews=function(){loadArticles();toast('正在刷新...')};

  loadArticles();
});

registerModule('english',()=>{
  let vocab=STO.get('wb_vocab',[]);
  let streak=STO.get('wb_eng_streak',{streak:0,lastDate:'',totalDays:0});
  let engTab='practice'; // practice | vocab | sentences

  // Built-in sentences
  const builtinSentences=[
    {en:'The only way to do great work is to love what you do.',zh:'做出伟大成就的唯一途径是热爱你所做的事。'},
    {en:'Stay hungry, stay foolish.',zh:'求知若饥，虚心若愚。'},
    {en:'Life is what happens when you\'re busy making other plans.',zh:'生活就是当你忙于制定其他计划时发生的事情。'},
    {en:'In the middle of difficulty lies opportunity.',zh:'困难之中蕴藏着机遇。'},
    {en:'The best time to plant a tree was 20 years ago. The second best time is now.',zh:'种一棵树最好的时间是二十年前，其次是现在。'},
    {en:'Action is the foundational key to all success.',zh:'行动是一切成功的基石。'},
    {en:'Don\'t count the days, make the days count.',zh:'不要数日子，要让每一天都有意义。'},
    {en:'Every expert was once a beginner.',zh:'每个专家都曾是初学者。'},
  ];

  // Quiz state
  let quizItem=null;
  let quizType='meaning'; // meaning | spelling
  let quizAnswer='';

  function saveV(){STO.set('wb_vocab',vocab)}
  function saveS(){STO.set('wb_eng_streak',streak)}

  function checkStreak(){
    const t=todayStr();
    if(streak.lastDate===t)return;
    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    const ys=fmtDate(yesterday);
    if(streak.lastDate===ys){streak.streak++;streak.totalDays++}
    else if(streak.lastDate!==t){streak.streak=1;streak.totalDays++}
    streak.lastDate=t;saveS();
  }

  function pickQuiz(){
    if(vocab.length===0){
      quizItem=builtinSentences[Math.floor(Math.random()*builtinSentences.length)];
      quizType='meaning';
    }else{
      if(Math.random()>.5&&vocab.length>0){
        quizItem=vocab[Math.floor(Math.random()*vocab.length)];
        quizType='meaning';
      }else{
        quizItem=vocab[Math.floor(Math.random()*vocab.length)];
        quizType='spelling';
      }
    }
    quizAnswer='';
  }
  if(!quizItem)pickQuiz();

  function render(){
    checkStreak();
    MAIN.innerHTML=`
      <div class="mod-header"><div class="mod-title">📖 英语练习</div></div>

      <!-- Streak -->
      <div class="eng-streak">
        <div class="eng-streak-num">🔥 ${streak.streak}</div>
        <div class="eng-streak-label">连续学习天数 · 累计 ${streak.totalDays} 天</div>
      </div>

      <!-- Tabs -->
      <div class="sub-tabs">
        <button class="sub-tab ${engTab==='practice'?'active':''}" data-etab="practice">📝 今日练习</button>
        <button class="sub-tab ${engTab==='vocab'?'active':''}" data-etab="vocab">📚 生词本</button>
        <button class="sub-tab ${engTab==='sentences'?'active':''}" data-etab="sentences">💬 每日短句</button>
      </div>

      ${engTab==='practice'?renderPractice():engTab==='vocab'?renderVocab():renderSentences()}`;

    $$('.sub-tab').forEach(t=>t.onclick=()=>{engTab=t.dataset.etab;render()});
  }

  function renderPractice(){
    if(!quizItem)pickQuiz();
    if(quizType==='meaning'){
      return `
      <div class="card">
        <div class="quiz-card">
          <div class="quiz-word">${esc(quizItem.word||quizItem.en||'')}</div>
          ${quizItem.example?`<div class="quiz-hint">例句：${esc(quizItem.example)}</div>`:''}
          <input class="quiz-input" id="quiz-answer" placeholder="输入中文意思..." autocomplete="off">
          <div class="quiz-result" id="quiz-result"></div>
          <button class="btn btn-primary" onclick="checkQuiz()" style="margin-top:10px">检查</button>
          <button class="btn btn-secondary" onclick="nextQuiz()" style="margin-top:10px;margin-left:6px">下一题</button>
        </div>
      </div>`;
    }else{
      return `
      <div class="card">
        <div class="quiz-card">
          <div class="quiz-word">${esc(quizItem.meaning||'')}</div>
          ${quizItem.example?`<div class="quiz-hint">例句：${esc(quizItem.example)}</div>`:''}
          <input class="quiz-input" id="quiz-answer" placeholder="输入英文单词..." autocomplete="off">
          <div class="quiz-result" id="quiz-result"></div>
          <button class="btn btn-primary" onclick="checkQuiz()" style="margin-top:10px">检查</button>
          <button class="btn btn-secondary" onclick="nextQuiz()" style="margin-top:10px;margin-left:6px">下一题</button>
        </div>
      </div>`;
    }
  }

  function renderVocab(){
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">📚 我的生词本 (${vocab.length})</div>
          <button class="btn btn-primary btn-sm" onclick="addVocabWord()">+ 添加</button>
        </div>
        ${vocab.length===0?'<div class="empty-state">还没有生词，点击右上角添加</div>':
        vocab.map((w,i)=>`
          <div class="list-item">
            <div class="list-item-body">
              <div class="list-item-title">${esc(w.word)}</div>
              <div class="list-item-meta">
                <span>${esc(w.meaning)}</span>
                ${w.example?`<span>💬 ${esc(w.example)}</span>`:''}
              </div>
            </div>
            <button class="btn btn-sm btn-danger" onclick="deleteVocab(${i})">删除</button>
          </div>
        `).join('')}
      </div>`;
  }

  function renderSentences(){
    return `
      <div class="card">
        <div class="card-header"><div class="card-title">💬 每日短句</div></div>
        ${builtinSentences.map((s,i)=>`
          <div class="list-item">
            <div class="list-item-body">
              <div class="list-item-title">${esc(s.en)}</div>
              <div class="list-item-meta">${esc(s.zh)}</div>
            </div>
            <button class="btn btn-sm btn-secondary" onclick="copyText('${esc(s.en).replace(/'/g,"\\'")}')">复制</button>
          </div>
        `).join('')}
      </div>`;
  }

  window.addVocabWord=function(){
    showModal('添加生词',`
      <div class="modal-field"><label>单词/短语</label><input class="input" id="vw-word" placeholder="例如：perseverance"></div>
      <div class="modal-field"><label>中文意思</label><input class="input" id="vw-meaning" placeholder="例如：坚持不懈"></div>
      <div class="modal-field"><label>例句（可选）</label><input class="input" id="vw-example" placeholder="例如：Perseverance is key to success."></div>
    `,()=>{
      const w=$('#vw-word').value.trim(),m=$('#vw-meaning').value.trim();
      if(!w||!m){toast('请填写单词和意思');return false}
      vocab.push({word:w,meaning:m,example:$('#vw-example').value.trim(),createdAt:Date.now()});
      saveV();render();toast('已添加');
    });
  };
  window.deleteVocab=function(i){vocab.splice(i,1);saveV();render();toast('已删除')};
  window.copyText=function(t){
    navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>toast('复制失败'));
  };
  window.checkQuiz=function(){
    const ans=$('#quiz-answer').value.trim();
    if(!ans){toast('请输入答案');return}
    const r=$('#quiz-result');
    let correct=false;
    if(quizType==='meaning'){
      const expected=quizItem.meaning||quizItem.zh||'';
      correct=ans.toLowerCase().includes(expected.toLowerCase().slice(0,2))||expected.toLowerCase().includes(ans.toLowerCase().slice(0,2));
    }else{
      correct=ans.toLowerCase()===((quizItem.word||quizItem.en||'').toLowerCase());
    }
    if(correct){r.textContent='✅ 正确！';r.className='quiz-result correct';checkStreak();saveS()}
    else{r.textContent=`❌ 答案是：${quizItem.meaning||quizItem.zh||quizItem.word||''}`;r.className='quiz-result wrong'}
  };
  window.nextQuiz=function(){pickQuiz();render()};

  render();
});

// ============================
//  MODULE 6: SETTINGS
// ============================
registerModule('settings',()=>{
  function render(){
    MAIN.innerHTML=`
      <div class="mod-header"><div class="mod-title">⚙️ 个人设置</div></div>
      <div class="card" style="margin:16px 12px">
        <div class="setting-item">
          <div><div class="setting-label">📤 数据备份</div><div class="setting-desc">导出全部数据为JSON文件，可保存到本地</div></div>
          <button class="btn btn-primary btn-sm" onclick="exportData()">导出</button>
        </div>
        <div class="setting-item">
          <div><div class="setting-label">📥 数据恢复</div><div class="setting-desc">从备份的JSON文件恢复数据</div></div>
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('import-file').click()">导入</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
        </div>
        <div class="setting-item">
          <div><div class="setting-label">🗑️ 清除缓存</div><div class="setting-desc">重置所有数据，此操作不可恢复</div></div>
          <button class="btn btn-danger btn-sm" onclick="clearAllData()">清除</button>
        </div>
      </div>
      <div class="card" style="margin:16px 12px">
        <div class="card-pad" style="font-size:13px;color:var(--text2);text-align:center">
          小周的工作台 v2.0<br>
          数据完全存储在浏览器本地，安全私密
        </div>
      </div>`;
  }

  window.exportData=function(){
    const data={};
    const keys=['wb_todos_full','wb_collections','wb_exercise_logs','wb_weights','wb_exercise_plans','wb_news_bookmarks','wb_vocab','wb_eng_streak'];
    keys.forEach(k=>{data[k]=STO.get(k,null)});
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='workbench-backup-'+todayStr()+'.json';a.click();
    toast('备份已下载');
  };

  window.importData=function(input){
    const file=input.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const data=JSON.parse(e.target.result);
        Object.entries(data).forEach(([k,v])=>{STO.set(k,v)});
        toast('数据已恢复，请刷新页面');
        setTimeout(()=>location.reload(),1000);
      }catch{toast('文件格式错误')}
    };
    reader.readAsText(file);
  };

  window.clearAllData=function(){
    if(confirm('确定要清除所有数据吗？此操作不可恢复！\n\n建议先导出备份。')){
      const keys=['wb_todos_full','wb_collections','wb_exercise_logs','wb_weights','wb_exercise_plans','wb_news_bookmarks','wb_vocab','wb_eng_streak'];
      keys.forEach(k=>localStorage.removeItem(k));
      toast('已清除，页面即将刷新');
      setTimeout(()=>location.reload(),1000);
    }
  };

  render();
});

navigateTo('todo');
